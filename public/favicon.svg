<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="outer-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feFlood flood-color="#22c55e" flood-opacity="0.6" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background - Full Bleed -->
  <rect x="-100" y="-100" width="1200" height="1200" fill="#111827" />

  <!-- Main Neon Circle - Maximized for maskable display -->
  <circle cx="500" cy="500" r="490" fill="none" stroke="#22c55e" stroke-width="25" filter="url(#outer-glow)" />

  <!-- Salami Icon Group - Scaled up further to fill the circle -->
  <g transform="translate(100, 310) scale(1.6)">
    <!-- Salami Outline -->
    <path d="M100,50 L400,50 C450,50 480,100 480,150 C480,200 450,250 400,250 L100,250 C50,250 20,200 20,150 C20,100 50,50 100,50 Z" fill="none" stroke="white" stroke-width="15" stroke-linecap="round" />
    <!-- End Detail -->
    <path d="M20,150 L-10,130 L-10,170 Z" fill="none" stroke="white" stroke-width="15" />
    
    <!-- Highlights on Salami -->
    <path d="M150,80 L230,80" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-dasharray="10 20" opacity="0.5" />

    <!-- Bar Chart Centered -->
    <rect x="115" y="180" width="30" height="50" fill="#22c55e" rx="4" />
    <rect x="175" y="140" width="30" height="90" fill="#22c55e" rx="4" />
    <rect x="235" y="120" width="30" height="110" fill="#22c55e" rx="4" />
    <rect x="295" y="80" width="30" height="150" fill="#22c55e" rx="4" />
    <rect x="355" y="60" width="30" height="170" fill="#22c55e" rx="4" />

    <!-- Trend Line / Arrow Shifted -->
    <path d="M105,220 L205,160 L285,190 L415,80" fill="none" stroke="#22c55e" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />
    <!-- Arrow Head -->
    <path d="M395,80 L420,75 L415,110" fill="#22c55e" filter="url(#neon-glow)" />

    <!-- Right side texture -->
    <circle cx="430" cy="120" r="10" fill="white" opacity="0.6" />
    <circle cx="450" cy="150" r="8" fill="white" opacity="0.6" />
    <circle cx="430" cy="180" r="12" fill="white" opacity="0.6" />
    <circle cx="400" cy="200" r="6" fill="white" opacity="0.6" />
  </g>
</svg>
